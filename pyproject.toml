[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "1.0.0"
description = "A lightweight CLI for running local LLMs using llama.cpp"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Oderoi"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "duckduckgo-search>=3.0.0",
    "wikipedia>=1.4.0",
    "PyPDF2>=3.0.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "huggingface_hub>=0.20.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.560.30; platform_system=='Linux' or platform_system=='Windows'",
]
[project.scripts]
delta = "delta.delta:main"

[project.urls]
Homepage = "https://github.com/oderoi/delta"
Repository = "https://github.com/oderoi/delta"

[tool.setuptools]
packages = ["delta"]
include-package-data = true

[tool.setuptools.package-data]
delta = ["img/*.png"]