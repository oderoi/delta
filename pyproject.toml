[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "1.0.0"
description = "A lightweight, privacy-focused CLI for running local LLMs using llama.cpp"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Oderoi", email = "oderoi@example.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["llm", "ai", "llama.cpp", "local", "privacy", "cli", "chatbot"]
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "huggingface_hub>=0.20.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "duckduckgo-search>=3.0.0",
    "wikipedia>=1.4.0",
    "PyPDF2>=3.0.0",
    "nvidia-ml-py>=12.560.30; platform_system=='Linux' or platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
gpu = [
    "nvidia-ml-py>=12.560.30",
    "torch>=2.0.0",
]
all = [
    "delta[dev,gpu]",
]

[project.scripts]
delta = "delta.cli:cli"

[project.urls]
Homepage = "https://github.com/oderoi/delta"
Repository = "https://github.com/oderoi/delta"
Documentation = "https://github.com/oderoi/delta#readme"
"Bug Tracker" = "https://github.com/oderoi/delta/issues"
Changelog = "https://github.com/oderoi/delta/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["delta"]
include-package-data = true

[tool.setuptools.package-data]
delta = ["img/*.png", "*.json", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=delta",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]